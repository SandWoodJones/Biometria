[project]
name = "biometria-voz"
version = "0.1.0"
description = "Projeto final Biometria UTFPR"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "triton-rocm",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "pyyaml",
    "soundfile",
    "tqdm",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
